# Lie le runtime C de Microsoft en statique : flow-tv.exe fonctionne sans
# installer le « Visual C++ Redistributable » sur le PC de l'utilisateur.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
