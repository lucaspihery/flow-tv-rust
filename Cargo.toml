[package]
name = "flow-tv"
version = "0.1.0"
edition = "2021"
description = "Flow TV - lecteur IPTV (Xtream Codes) rapide pour Windows"
authors = ["Lucas Pihery"]
license = "Proprietary"
build = "build.rs"

[[bin]]
name = "flow-tv"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "accessibility"] }
rusqlite = { version = "0.42", features = ["bundled"] }
ureq = { version = "3", features = ["gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
directories = "6"
chrono = "0.4"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
